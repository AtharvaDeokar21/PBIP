</style>
<defs>
<marker id="sa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#334155"/></marker>
<marker id="oa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#334155" stroke-width="1.4"/></marker>
</defs><rect width="1180" height="756" fill="#ffffff"/><text x="30" y="36" class="t">Sequence — UC-08 AI assistant interaction</text><text x="30" y="58" class="s">Intent routing to banking tools; the LLM never receives customer data or database access (POST /api/v1/ai/chat)</text><line x1="110" y1="118" x2="110" y2="736" class="ll"/><rect x="28" y="76" width="164" height="44" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/><text x="110" y="95" text-anchor="middle" class="p">Customer</text><text x="110" y="111" text-anchor="middle" class="ps">browser</text><line x1="300" y1="118" x2="300" y2="736" class="ll"/><rect x="218" y="76" width="164" height="44" rx="7" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/><text x="300" y="95" text-anchor="middle" class="p">Frontend</text><text x="300" y="111" text-anchor="middle" class="ps">AI chat panel</text><line x1="490" y1="118" x2="490" y2="736" class="ll"/><rect x="408" y="76" width="164" height="44" rx="7" fill="#f1f5f9" stroke="#334155" stroke-width="1.5"/><text x="490" y="95" text-anchor="middle" class="p">customer-service</text><text x="490" y="111" text-anchor="middle" class="ps">ai router</text><line x1="680" y1="118" x2="680" y2="736" class="ll"/><rect x="598" y="76" width="164" height="44" rx="7" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/><text x="680" y="95" text-anchor="middle" class="p">Domain services</text><text x="680" y="111" text-anchor="middle" class="ps">account, loan, …</text><line x1="870" y1="118" x2="870" y2="736" class="ll"/><rect x="788" y="76" width="164" height="44" rx="7" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/><text x="870" y="95" text-anchor="middle" class="p">PostgreSQL</text><text x="870" y="111" text-anchor="middle" class="ps">Supabase</text><line x1="1060" y1="118" x2="1060" y2="736" class="ll"/><rect x="978" y="76" width="164" height="44" rx="7" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/><text x="1060" y="95" text-anchor="middle" class="p">Groq LLM</text><text x="1060" y="111" text-anchor="middle" class="ps">external API</text><rect x="150" y="290" width="1010" height="314" fill="#fff7ed" fill-opacity="0.35" stroke="#ea580c" stroke-width="1.1"/><line x1="110" y1="150" x2="294" y2="150" class="ln" marker-end="url(#sa)"/><text x="205.0" y="144" text-anchor="middle" class="m">“How much did I spend?”</text><line x1="300" y1="186" x2="484" y2="186" class="ln" marker-end="url(#sa)"/><text x="395.0" y="180" text-anchor="middle" class="m">POST /ai/chat {message, conversation_id}</text><line x1="490" y1="222" x2="864" y2="222" class="ln" marker-end="url(#sa)"/><text x="680.0" y="216" text-anchor="middle" class="m">load/create conversation · save user msg</text><path d="M490,254 L524,254 L524,270 L496,270" class="ln" marker-end="url(#sa)"/><text x="532" y="266" class="m">match intent keywords → tool</text><line x1="490" y1="326" x2="674" y2="326" class="ln" marker-end="url(#sa)"/><text x="585.0" y="320" text-anchor="middle" class="m">run tool for this customer only</text><line x1="680" y1="362" x2="864" y2="362" class="ln" marker-end="url(#sa)"/><text x="775.0" y="356" text-anchor="middle" class="m">query customer&#x27;s own data</text><line x1="870" y1="398" x2="686" y2="398" class="ln" stroke-dasharray="6 4" marker-end="url(#oa)"/><text x="775.0" y="392" text-anchor="middle" class="r">rows</text><line x1="680" y1="434" x2="496" y2="434" class="ln" stroke-dasharray="6 4" marker-end="url(#oa)"/><text x="585.0" y="428" text-anchor="middle" class="r">summary</text><path d="M490,466 L524,466 L524,482 L496,482" class="ln" marker-end="url(#sa)"/><text x="532" y="478" class="m">format answer (masked a/c numbers)</text><line x1="490" y1="538" x2="1054" y2="538" class="ln" marker-end="url(#sa)"/><text x="775.0" y="532" text-anchor="middle" class="m">chat/completions (system prompt + question)</text><line x1="1060" y1="574" x2="496" y2="574" class="ln" stroke-dasharray="6 4" marker-end="url(#oa)"/><text x="775.0" y="568" text-anchor="middle" class="r">text (on error → built-in help text)</text><rect x="150" y="290" width="38" height="18" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="156" y="303" class="fr">alt</text><text x="196" y="303" class="fr">[banking intent: spending, balance, loans, transactions, recommendations, investments, profile]</text><line x1="150" y1="502" x2="1160" y2="502" stroke="#ea580c" stroke-dasharray="6 4"/><rect x="150" y="502" width="46" height="18" fill="#ffedd5" stroke="#ea580c" stroke-width="1"/><text x="156" y="515" class="fr">else</text><text x="204" y="515" class="fr">[general question and GROQ_API_KEY configured]</text><line x1="490" y1="618" x2="864" y2="618" class="ln" marker-end="url(#sa)"/><text x="680.0" y="612" text-anchor="middle" class="m">save assistant msg (tool_name) · COMMIT</text><line x1="490" y1="654" x2="306" y2="654" class="ln" stroke-dasharray="6 4" marker-end="url(#oa)"/><text x="395.0" y="648" text-anchor="middle" class="r">200 {response, tool_used}</text><line x1="300" y1="690" x2="116" y2="690" class="ln" stroke-dasharray="6 4" marker-end="url(#oa)"/><text x="205.0" y="684" text-anchor="middle" class="r">answer rendered in chat</text></svg>