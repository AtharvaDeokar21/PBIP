<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 756" width="1180" height="756" font-family="Segoe UI, Helvetica, Arial, sans-serif"><style>
.t{font-size:20px;font-weight:700;fill:#0f172a}
.s{font-size:12.5px;fill:#475569}
.p{font-size:13px;font-weight:700;fill:#0f172a}
.ps{font-size:10.5px;fill:#475569}
.m{font-size:12px;fill:#0f172a}
.r{font-size:12px;fill:#475569;font-style:italic}
