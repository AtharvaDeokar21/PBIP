text x="1060" y="111" text-anchor="middle" class="ps">Supabase</text><rect x="150" y="616" width="1010" height="166" fill="#fff7ed" fill-opacity="0.35" stroke="#ea580c" stroke-width="1.1"/><line x1="110" y1="150" x2="294" y2="150" class="ln" marker-end="url(#sa)"/><text x="205.0" y="144" text-anchor="middle" class="m">open investigations</text><line x1="300" y1="186" x2="484" y2="186" class="ln" marker-end="url(#sa)"/><text x="395.0" y="180" text-anchor="middle" class="m">GET /api/v1/fraud/investigations</text><rect x="502" y="206" width="188.20000000000002" height="24" rx="3" fill="#fefce8" stroke="#eab308"/><text x="510" y="222" font-size="11.5" fill="#713f12">prefix fraud → admin-service</text><line x1="490" y1="256" x2="674" y2="256" class="ln" marker-end="url(#sa)"/><text x="585.0" y="250" text-anchor="middle" class="m">proxy</text><path d="M680,288 L714,288 L714,304 L686,304" class="ln" marker-end="url(#sa)"/><text x="722" y="300" class="m">require_roles(FRAUD_ANALYST, ADMIN)</text><line x1="680" y1="332" x2="864" y2="332" class="ln" marker-end="url(#sa)"/><text x="775.0" y="326" text-anchor="middle" class="m">list_investigations(filters)</text><line x1="870" y1="368" x2="1054" y2="368" class="ln" marker-end="url(#sa)"/><text x="965.0" y="362" text-anchor="middle" class="m">investigations ⋈ alerts ⋈ events ⋈ customers</text><line x1="870" y1="404" x2="306" y2="404" class="ln" stroke-dasharray="6 4" marker-end="url(#oa)"/><text x="585.0" y="398" text-anchor="middle" class="r">page of investigations (risk, severity)</text><line x1="110" y1="440" x2="294" y2="440" class="ln" marker-end="url(#sa)"/><text x="205.0" y="434" text-anchor="middle" class="m">set status + resolution notes</text><line x1="300" y1="476" x2="674" y2="476" class="ln" marker-end="url(#sa)"/><text x="490.0" y="470" text-anchor="middle" class="m">PATCH /fraud/alerts/{id}</text><line x1="680" y1="512" x2="864" y2="512" class="ln" marker-end="url(#sa)"/><text x="775.0" y="506" text-anchor="middle