</defs><rect width="940" height="500" fill="#ffffff"/><text x="30" y="36" class="t">State machine — Transfer lifecycle</text><text x="30" y="58" class="s">payment_service.ALLOWED_TRANSITIONS (customer may cancel only PENDING or SCHEDULED)</text><line x1="312.7894736842105" y1="156.0" x2="457.2105263157895" y2="205.0" class="ln" marker-end="url(#sa)"/><rect x="357.9" y="169.5" width="54.199999999999996" height="16" fill="#ffffff"/><text x="385.0" y="181.5" text-anchor="middle" font-size="11" fill="#475569">execute</text><line x1="312.7894736842105" y1="300.0" x2="457.2105263157895" y2="251.0" class="ln" marker-end="url(#sa)"/><rect x="328.2" y="264.5" width="113.6" height="16" fill="#ffffff"/><text x="385.0" y="276.5" text-anchor="middle" font-size="11" fill="#475569">due date reached</text><line x1="595.2105263157895" y1="205.0" x2="744.7894736842105" y2="156.0" class="ln" marker-end="url(#sa)"/><rect x="623.1" y="169.5" width="93.8" height="16" fill="#ffffff"/><text x="670.0" y="181.5" text-anchor="middle" font-size="11" fill="#475569">ledger posted</text><line x1="595.2105263157895" y1="251.0" x2="744.7894736842105" y2="300.0" class="ln" marker-end="url(#sa)"/><rect x="649.5" y="264.5" width="41.0" height="16" fill="#ffffff"/><text x="670.0" y="276.5" text-anchor="middle" font-size="11" fill="#475569">error</text><path d="M253.6156351791531,156.0 Q360,440 450.0,430.72727272727275" class="ln" marker-end="url(#sa)"/><line x1="309.4" y1="346.0" x2="460.6" y2="400.0" class="ln" marker-end="url(#sa)"/><rect x="331.5" y="362.0" width="107.0" height="16" fill="#ffffff"/><text x="385.0" y="374.0" text-anchor="middle" font-size="11" fill="#475569">customer cancel</text><path d="M320.0,113.35211267605634 Q600,40 797.5265017667845,300.0" class="ln" marker-end="url(#sa)"/><rect x="522.5816254416961" y="112.33802816901408" width="113.6" height="16" fill="#ffffff"/><text x="579.3816254416961" y="124.33802816901408" text-anchor="middle" font-size="11" fill="#475569">validation fails</text><circle cx="50" cy="205" r="9" fill="#0f172a"/><line x1="59" y1="205" x2="182.70833333333334" y2="156.0" class="ln" marker-end="url(#sa)"/><text x="116.35416666666667" y="174.5" text-anchor="middle" font-size="11" fill="#475569">immediate</text><line x1="59" y1="205" x2="206.9915254237288" y2="300.0" class="ln" marker-end="url(#sa)"/><text x="128.49576271186442" y="246.5" text-anchor="middle" font-size="11" fill="#475569">scheduled</text><rect x="170" y="110" width="150" height="46" rx="11" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="245.0" y="138" text-anchor="middle" class="p">PENDING</text><rect x="170" y="300" width="150" height="46" rx="11" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/><text x="245.0" y="328" text-anchor="middle" class="p">SCHEDULED</text><rect x="450" y="205" width="150" height="46" rx="11" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/><text x="525.0" y="233" text-anchor="middle" class="p">PROCESSING</text><rect x="736" y="106" width="158" height="54" rx="14" fill="none" stroke="#059669" stroke-width="1.2"/><rect x="740" y="110" width="150" height="46" rx="11" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/><text x="815.0" y="138" text-anchor="middle" class="p">COMPLETED</text><rect x="736" y="296" width="158" height="54" rx="14" fill="none" stroke="#dc2626" stroke-width="1.2"/><rect x="740" y="300" width="150" height="46" rx="11" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/><text x="815.0" y="328" text-anchor="middle" class="p">FAILED</text><rect x="446" y="396" width="158" height="54" rx="14" fill="none" stroke="#64748b" stroke-width="1.2"/><rect x="450" y="400" width="150" height="46" rx="11" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/><text x="525.0" y="428" text-anchor="middle" class="p">CANCELLED</text><text x="30" y="464" class="s">Unlabelled curve: PENDING → CANCELLED (customer cancel).</text><text x="30" y="484" class="s">Double border = final state. Any other transition is rejected by the service with HTTP 409/422 and nothing is written.</text></svg>