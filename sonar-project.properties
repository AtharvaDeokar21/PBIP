# SonarQube analysis of Credora (Python backend + TypeScript/JavaScript frontend).
# Used by ci/scripts/sonar-scan.sh; server URL and token come from Jenkins.

sonar.projectKey=credora
sonar.projectName=Credora
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Sources and tests
sonar.sources=backend/app,backend/scripts,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,backend/alembic/versions/**
sonar.test.inclusions=backend/tests/**,frontend/tests/**

# Python
sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/reports/coverage.xml
sonar.python.xunit.reportPath=backend/reports/junit.xml
sonar.python.ruff.reportPaths=backend/reports/ruff.json

# TypeScript / JavaScript
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
sonar.javascript.environments=browser,node

# Coverage is measured for the backend application code only
# (the frontend has end-to-end tests but no unit-test coverage).
sonar.coverage.exclusions=frontend/**,backend/scripts/**,backend/tests/**

# Duplication: generated/fixture data is not product code.
sonar.cpd.exclusions=frontend/src/lib/sample-data.ts,frontend/src/lib/admin/sample-data.ts
