# Jenkins configuration as code for the Credora CI stack.
# Secrets come from files mounted by ci/docker-compose.yml:
#   /run/secrets/credora.env  - repository-root .env (application configuration)
#   /run/secrets/sonar/token  - SonarQube analysis token written by sonar-init

jenkins:
  systemMessage: "Credora CI/CD — pipeline: credora (branch feature/cicd)"
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER:-admin}"
          name: "Credora Admin"
          password: "${JENKINS_ADMIN_PASSWORD:-admin}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - file:
              scope: GLOBAL
              id: credora-env
              description: "Credora application .env (mounted from the repository root)"
              fileName: ".env"
              secretBytes: "${readFileBase64:/run/secrets/credora.env}"
          - string:
              scope: GLOBAL
              id: sonar-token
              description: "SonarQube analysis token (generated by sonar-init)"
              secret: "${readFile:/run/secrets/sonar/token}"

unclassified:
  location:
    url: "http://localhost:8081/"
  sonarGlobalConfiguration:
    buildWrapperEnabled: false
    installations:
      - name: sonarqube
        serverUrl: "http://sonarqube:9000"
        credentialsId: sonar-token
  prometheusConfiguration:
    path: "prometheus"
    useAuthenticatedEndpoint: false
    collectingMetricsPeriodInSeconds: 60
    defaultNamespace: "default"
    countSuccessfulBuilds: true
    countUnstableBuilds: true
    countFailedBuilds: true
    countNotBuiltBuilds: true
    countAbortedBuilds: true
    fetchTestResults: true
    processingDisabledBuilds: false

jobs:
  - script: |
      pipelineJob('credora') {
        description('Credora CI/CD: backend tests, frontend checks, SonarQube analysis and quality gate, image build, deploy, database seed.')
        logRotator {
          numToKeep(20)
        }
        properties {
          pipelineTriggers {
            triggers {
              pollSCM {
                scmpoll_spec('H/2 * * * *')
              }
            }
          }
        }
        definition {
          cpsScm {
            scm {
              git {
                remote {
                  url('https://github.com/AtharvaDeokar21/PBIP.git')
                }
                branch('*/feature/cicd')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
      // No explicit queue(): Jenkins discards items queued during start-up.
      // SCM polling starts the first build within 2 minutes (no previous build).
