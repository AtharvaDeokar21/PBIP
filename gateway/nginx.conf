# Credora API gateway.
#   /api/v1/analytics|fraud|compliance  -> admin-service
#   /api/v1/* (everything else, incl. the shared /auth/login) -> customer-service
#   /                                    -> frontend
# backend/tests/test_service_split.py parses the admin location regex below.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS; resolving per request lets containers restart
    # without restarting the gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep a caller-supplied request id, otherwise generate one.
    map $http_x_request_id $credora_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # One JSON object per request for Loki. $uri excludes the query string,
    # which can contain customer search terms.
    log_format gateway_json escape=json
        '{"ts":"$time_iso8601","service":"gateway","request_id":"$credora_request_id",'
        '"client_ip":"$remote_addr","method":"$request_method","uri":"$uri",'
        '"protocol":"$server_protocol","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"upstream":"$upstream_addr",'
        '"upstream_status":"$upstream_status","upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';
    access_log /dev/stdout gateway_json;
    error_log /dev/stderr warn;

    client_max_body_size 10m;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        set $customer_service http://customer-service:8000;
        set $admin_service    http://admin-service:8000;
        set $frontend         http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (not append) so clients cannot spoof their IP in audit logs.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $credora_request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        # Services echo the id too; send it to the client exactly once.
        proxy_hide_header X-Request-ID;
        add_header X-Request-ID $credora_request_id always;

        proxy_connect_timeout 5s;
        # AI chat waits on the LLM provider.
        proxy_read_timeout 120s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/v1/(analytics|fraud|compliance)(/|$) {
            proxy_pass $admin_service;
        }

        location /api/ {
            proxy_pass $customer_service;
        }

        location / {
            # Let Next.js stream Server Component responses.
            proxy_buffering off;
            proxy_pass $frontend;
        }
    }

    # Internal metrics endpoint for nginx-prometheus-exporter (port not published).
    server {
        listen 8081;
        access_log off;

        location = /stub_status {
            stub_status;
        }
    }
}
