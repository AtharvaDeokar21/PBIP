# Credora API gateway.
#   /api/v1/analytics|fraud|compliance  -> admin-service
#   /api/v1/* (everything else, incl. the shared /auth/login) -> customer-service
#   /                                    -> frontend
# backend/tests/test_service_split.py parses the admin location regex below.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS; resolving per request lets containers restart
    # without restarting the gateway.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Keep a caller-supplied request id, otherwise generate one.
    map $http_x_request_id $credora_request_id {
        default $http_x_request_id;
        ""      $request_id;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    log_format gateway '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                       'rt=$request_time upstream=$upstream_addr urt=$upstream_response_time '
                       'rid=$credora_request_id';
    access_log /dev/stdout gateway;
    error_log /dev/stderr warn;

    client_max_body_size 10m;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 80;
        server_name _;

        set $customer_service http://customer-service:8000;
        set $admin_service    http://admin-service:8000;
        set $frontend         http://frontend:3000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Overwrite (not append) so clients cannot spoof their IP in audit logs.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Request-ID      $credora_request_id;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        add_header X-Request-ID $credora_request_id always;

        proxy_connect_timeout 5s;
        # AI chat waits on the LLM provider.
        proxy_read_timeout 120s;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location ~ ^/api/v1/(analytics|fraud|compliance)(/|$) {
            proxy_pass $admin_service;
        }

        location /api/ {
            proxy_pass $customer_service;
        }

        location / {
            # Let Next.js stream Server Component responses.
            proxy_buffering off;
            proxy_pass $frontend;
        }
    }
}
