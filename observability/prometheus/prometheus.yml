global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: customer-service
    static_configs:
      - targets: ["customer-service:8000"]
        labels:
          service: customer-service

  - job_name: admin-service
    static_configs:
      - targets: ["admin-service:8000"]
        labels:
          service: admin-service

  - job_name: gateway
    static_configs:
      - targets: ["nginx-exporter:9113"]
        labels:
          service: gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]

  # CI stack (ci/docker-compose.yml); down while the CI stack is not running.
  - job_name: jenkins
    metrics_path: /prometheus/
    static_configs:
      - targets: ["host.docker.internal:8081"]
