name: credora

# Credora microservices stack.
#
#   docker compose up --build                      # gateway + frontend + customer/admin services
#   docker compose --profile seed run --rm seed    # migrate + seed demo data + synthetic data
#   docker compose --profile setup run --rm migrate
#
# Open the app at http://localhost:8080 (everything goes through the gateway).
# Database: the Supabase PostgreSQL from DATABASE_URL in the root .env file.

x-backend: &backend
  build: ./backend
  image: credora-backend:dev
  env_file:
    - path: ./.env
      required: true
  volumes:
    - ./backend:/app
  # Uncomment together with the `postgres` service below to use a local DB.
  # depends_on:
  #   postgres:
  #     condition: service_healthy

x-backend-healthcheck: &backend-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
  interval: 10s
  timeout: 5s
  retries: 6
  start_period: 15s

services:
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - customer-service
      - admin-service
      - frontend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8080/api/v1
    image: credora-frontend:dev
    restart: unless-stopped

  customer-service:
    <<: *backend
    command: >-
      uvicorn app.customer_main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*
    ports:
      - "8001:8000"
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  admin-service:
    <<: *backend
    command: >-
      uvicorn app.admin_main:app --host 0.0.0.0 --port 8000 --reload
      --proxy-headers --forwarded-allow-ips=*
    ports:
      - "8002:8000"
    healthcheck: *backend-healthcheck
    restart: unless-stopped

  # One-shot jobs -----------------------------------------------------------

  migrate:
    <<: *backend
    profiles: ["setup"]
    command: alembic upgrade heads

  seed:
    <<: *backend
    profiles: ["seed"]
    command: >-
      sh -c "alembic upgrade heads
      && python -m scripts.seed
      && python -m data.generators.generate"

  # Optional local Postgres (disabled — the stack uses Supabase) ------------
  # To use it: uncomment this service, the depends_on block in x-backend and
  # the volumes section at the bottom, then set in .env:
  #   DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/credora
  #
  # postgres:
  #   image: postgres:16-alpine
  #   profiles: ["local-db"]
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: credora
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - credora-pgdata:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres -d credora"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 10

# volumes:
#   credora-pgdata:
